[project]
name = "auth-kit"
version = "1.0.0"
description = "Production-ready auth-kit service for local auth, profiles, sessions, admin flows, avatars, and password recovery"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.1.1",
  "fastapi>=0.110",
  "httpx>=0.27.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=7.4",
  "ruff>=0.6",
]

[tool.mypy]
python_version = "3.12"
packages = ["auth_kit"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
